<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mine opgaver</title>
<style>
  :root {
    --bg: #eef4f7;
    --surface: #ffffff;
    --ink: #0d2230;
    --muted: #587083;
    --line: #d3e1e8;
    --accent: #0e7490;
    --accent-ink: #ffffff;
    --navy: #1d4e89;
    --c0: #0e7490; --c1: #1d4e89; --c2: #0f766e;
    --c3: #3b82c4; --c4: #155e75; --c5: #2a9d8f;
    --f0: #9fe9fa; --f1: #a9ccfb; --f2: #9ff0dc;
    --f3: #bcdcff; --f4: #8fdcec; --f5: #b2f5e6;
    --chip-ink: #06222f;
    --edge1: #bcd3dd; --edge2: #a6c2cf;
    --glow: rgba(14, 116, 144, 0.28);
    --hi: rgba(255, 255, 255, 0.85);
    --inset: rgba(13, 34, 48, 0.18);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0a1820;
      --surface: #11232d;
      --ink: #e3eff5;
      --muted: #8fa8b7;
      --line: #213744;
      --accent: #4cc3d9;
      --accent-ink: #062029;
      --navy: #6aa7ee;
      --c0: #4cc3d9; --c1: #6aa7ee; --c2: #3fc4b4;
      --c3: #7fb6ee; --c4: #56b4cc; --c5: #5fd0c0;
      --edge1: #0a1a22; --edge2: #06121a;
      --glow: rgba(76, 195, 217, 0.18);
      --hi: rgba(255, 255, 255, 0.07);
      --inset: rgba(0, 0, 0, 0.55);
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--bg); color: var(--ink);
    font: 16px/1.5 "Avenir Next", "Segoe UI", system-ui, sans-serif;
    padding: 24px 16px 64px;
  }
  main { max-width: 1100px; margin: 0 auto; }
  header {
    display: flex; align-items: center; justify-content: space-between;
    gap: 16px; flex-wrap: wrap; margin-bottom: 20px;
  }
  h1 { font-size: 1.8rem; margin: 0; letter-spacing: -0.01em; }
  h2 { font-size: 1rem; margin: 0; letter-spacing: 0.02em; }
  .bar { display: flex; gap: 12px; align-items: center; }
  .status { color: var(--muted); font-size: 0.875rem; }
  button {
    font: inherit; cursor: pointer; border: 1px solid var(--accent);
    background: var(--accent); color: var(--accent-ink);
    padding: 8px 16px; border-radius: 6px;
  }
  button:disabled { opacity: 0.6; cursor: default; }
  button.ghost { background: transparent; color: var(--accent); }
  button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible {
    outline: 3px solid var(--accent); outline-offset: 2px;
  }
  .card {
    background: var(--surface); border: 1px solid var(--line);
    border-radius: 8px; padding: 16px 20px; margin-bottom: 16px;
  }
  .card-head {
    display: flex; justify-content: space-between; align-items: baseline;
    gap: 12px; flex-wrap: wrap; margin-bottom: 12px;
  }
  .caption { color: var(--muted); font-size: 0.85rem; }
  .notice h2 { font-size: 1.1rem; margin-bottom: 8px; }
  .error { color: var(--navy); border-color: var(--navy); }
  [hidden] { display: none !important; }

  /* Tidslinje: hævet plade med en nedsænket skinne */
  .card.raised {
    border-radius: 12px; padding: 20px 22px; margin-bottom: 32px;
    background: linear-gradient(180deg, var(--surface), color-mix(in srgb, var(--surface) 86%, var(--accent)));
    border: 1px solid color-mix(in srgb, var(--accent) 35%, var(--line));
    box-shadow:
      inset 0 1px 0 var(--hi),
      0 3px 0 var(--edge1),
      0 6px 0 var(--edge2),
      0 18px 32px var(--glow);
  }
  .tl-scroll {
    overflow-x: auto; padding: 14px 8px 6px; border-radius: 8px;
    background: color-mix(in srgb, var(--bg) 75%, var(--surface));
    box-shadow: inset 0 3px 8px var(--inset), inset 0 -1px 0 var(--hi);
  }
  .tl-track { display: grid; min-width: min-content; position: relative; }
  .day { display: flex; flex-direction: column; min-width: 0; padding: 0 3px; }
  .day.weekend { background: color-mix(in srgb, var(--accent) 6%, transparent); }
  .stack {
    flex: 1; display: flex; flex-direction: column; justify-content: flex-end;
    gap: 6px; padding-bottom: 10px; min-height: 28px;
  }
  .chip {
    --lc: var(--c0); --lf: var(--f0);
    display: block; width: 100%; text-align: left; cursor: pointer;
    font: inherit; font-size: 0.78rem; line-height: 1.25; font-weight: 600;
    padding: 5px 7px; border-radius: 6px; color: var(--chip-ink);
    background: linear-gradient(180deg, color-mix(in srgb, var(--lf) 70%, white), var(--lf));
    border: 1px solid color-mix(in srgb, var(--lc) 55%, white);
    border-left: 4px solid var(--lc);
    box-shadow:
      inset 0 1px 0 rgba(255, 255, 255, 0.7),
      0 2px 0 color-mix(in srgb, var(--lc) 70%, black),
      0 5px 12px color-mix(in srgb, var(--lc) 45%, transparent);
    transition: transform 0.12s ease, box-shadow 0.12s ease;
  }
  .chip:hover { transform: translateY(-2px); }
  .chip:active { transform: translateY(1px); }
  .chip .ct {
    display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical;
    overflow: hidden; word-break: break-word;
  }
  .chip.overdue { border-style: dashed; border-left-style: solid; }
  .day.has .stack { padding-bottom: 0; }
  .day.has .stack::after {
    content: ""; align-self: center; flex: none; width: 2px; height: 12px;
    border-radius: 1px; background: var(--accent); opacity: 0.65;
  }
  .day.focus { background: color-mix(in srgb, var(--accent) 14%, transparent); border-radius: 6px; }
  .axis { position: relative; height: 16px; }
  .axis::before {
    content: ""; position: absolute; left: -3px; right: -3px; top: 6px; height: 4px;
    border-radius: 2px; background: color-mix(in srgb, var(--line) 80%, var(--muted));
    box-shadow: inset 0 1px 1px var(--inset);
  }
  .axis::after {
    content: ""; position: absolute; left: 50%; top: 4px; width: 8px; height: 8px;
    margin-left: -4px; border-radius: 50%; background: var(--muted);
  }
  .day.has .axis::after { background: var(--accent); }
  .day.today .axis::after {
    width: 14px; height: 14px; top: 1px; margin-left: -7px; background: var(--accent);
    box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 28%, transparent);
  }
  .dlabel { text-align: center; font-size: 0.78rem; padding-top: 6px; min-height: 2.6em; }
  .dlabel .wd { display: block; color: var(--muted); text-transform: capitalize; }
  .day.today .dlabel { font-weight: 700; color: var(--accent); }

  .day.empty .dlabel { font-size: 0.72rem; color: var(--muted); }
  .dlabel .wd { min-height: 1.2em; }
  .tl-nav { display: flex; justify-content: center; gap: 10px; margin-top: 14px; }
  .nav {
    width: 36px; height: 28px; padding: 0; font-size: 1rem; line-height: 1;
    background: var(--surface); color: var(--accent);
    border: 1px solid color-mix(in srgb, var(--accent) 45%, transparent);
    box-shadow: 0 2px 0 var(--edge2);
  }
  .nav:hover { background: color-mix(in srgb, var(--accent) 12%, var(--surface)); }
  .nav:active { transform: translateY(1px); box-shadow: 0 1px 0 var(--edge2); }

  /* Ny opgave (foldud) */
  details.card.add { padding: 0; width: fit-content; max-width: 100%; }
  details.card.add[open] { width: 100%; }
  details.add summary {
    cursor: pointer; list-style: none; padding: 8px 16px; font-weight: 600;
    color: var(--accent); display: flex; align-items: center; gap: 8px;
  }
  details.add summary::-webkit-details-marker { display: none; }
  details.add summary::before {
    content: "+"; width: 20px; height: 20px; display: inline-grid; place-items: center;
    border-radius: 50%; border: 1px solid currentColor; font-size: 1.1rem; line-height: 1;
  }
  details.add[open] summary::before { content: "–"; }
  details.add summary:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; border-radius: 8px; }
  details.add .new { padding: 4px 16px 16px; }

  /* Ny opgave */
  .new { display: grid; grid-template-columns: 1fr; gap: 10px; }
  @media (min-width: 720px) { .new { grid-template-columns: 2fr 1fr 1fr auto; } }
  input[type="text"], input[type="date"], select, textarea {
    font: inherit; color: var(--ink); background: var(--surface);
    border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; width: 100%;
  }
  textarea { resize: vertical; }

  /* Kategorier */
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 16px; }
  .box {
    --lc: var(--c0);
    background: var(--surface); border: 1px solid var(--line);
    border-top: 4px solid var(--lc); border-radius: 8px; padding: 14px 18px;
  }
  .box h3 { margin: 0 0 6px; font-size: 1rem; color: var(--lc); }
  ul { list-style: none; margin: 0; padding: 0; }
  li { display: flex; gap: 10px; padding: 8px 0; border-top: 1px solid var(--line); align-items: flex-start; }
  li:first-child { border-top: 0; }
  li.sub { margin-left: 26px; }
  .tick {
    flex: none; width: 20px; height: 20px; margin-top: 2px; padding: 0; position: relative;
    border: 2px solid var(--lc); border-radius: 5px; background: transparent; cursor: pointer;
  }
  .tick:hover { background: color-mix(in srgb, var(--lc) 18%, transparent); }
  li.done .tick, li.done .tick:hover { background: var(--lc); }
  li.done .tick::after {
    content: ""; position: absolute; left: 5px; top: 1px; width: 5px; height: 10px;
    border: solid var(--surface); border-width: 0 2px 2px 0; transform: rotate(45deg);
  }
  li.done .title { color: var(--muted); text-decoration: line-through; }
  li .body { flex: 1; min-width: 0; }
  .title { font-weight: 500; word-break: break-word; }
  .meta { font-size: 0.82rem; color: var(--muted); word-break: break-word; }
  .meta.late { color: var(--navy); font-weight: 600; }
  .edit {
    flex: none; background: transparent; color: var(--lc);
    border: 1px solid color-mix(in srgb, var(--lc) 45%, transparent);
    padding: 2px 8px; border-radius: 6px; font-size: 0.9rem; line-height: 1.4;
  }
  .edit:hover { background: color-mix(in srgb, var(--lc) 14%, transparent); }
  .toggle { font-size: 0.85rem; color: var(--muted); display: flex; gap: 6px; align-items: center; }

  /* Redigér-dialog */
  dialog {
    background: var(--surface); color: var(--ink);
    border: 1px solid var(--line); border-radius: 12px; padding: 20px 22px;
    width: min(440px, calc(100vw - 32px));
    box-shadow: 0 20px 50px rgba(0, 0, 0, 0.35);
  }
  dialog::backdrop { background: rgba(6, 24, 32, 0.55); }
  dialog form { display: grid; gap: 12px; }
  dialog label { display: grid; gap: 4px; font-size: 0.875rem; color: var(--muted); }
  dialog label.check { display: flex; gap: 8px; align-items: center; color: var(--ink); }
  .actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 4px; }
  .err { color: var(--navy); font-size: 0.875rem; margin: 0; }
</style>
</head>
<body>
<main>
  <header>
    <h1>Mine opgaver</h1>
    <div class="bar">
      <span class="status" id="status"></span>
      <button class="ghost" id="refresh" hidden>Opdater</button>
    </div>
  </header>

  <div id="setup" class="card notice" hidden>
    <h2>Klient-id mangler</h2>
    <p>Åbn filen i en teksteditor og indsæt dit Google OAuth klient-id i <code>CLIENT_ID</code> øverst i scriptet.</p>
  </div>

  <div id="login" class="card notice" hidden>
    <h2>Log ind for at se dine opgaver</h2>
    <p>Siden henter dine lister fra Google Tasks og kan oprette og redigere opgaver.</p>
    <button id="signin">Log ind med Google</button>
  </div>

  <div id="error" class="card notice error" hidden></div>

  <div id="app" hidden>
    <section class="card raised">
      <div class="card-head">
        <h2>Tidslinje</h2>
        <span class="caption" id="tlcaption"></span>
      </div>
      <div id="timeline"></div>
      <div class="tl-nav" id="tlnav" hidden>
        <button type="button" class="nav" id="tlPrev" aria-label="Forrige opgave" title="Forrige opgave">←</button>
        <button type="button" class="nav" id="tlNext" aria-label="Næste opgave" title="Næste opgave">→</button>
      </div>
    </section>

    <details class="card add" id="addBox">
      <summary>Tilføj opgave</summary>
      <form class="new" id="newForm">
        <input type="text" id="newTitle" placeholder="Hvad skal laves?" aria-label="Titel" required>
        <input type="date" id="newDue" aria-label="Deadline (valgfri)">
        <select id="newList" aria-label="Kategori"></select>
        <button type="submit" id="newBtn">Tilføj</button>
      </form>
    </details>

    <div class="card-head" style="margin: 8px 4px 12px">
      <h2>Kategorier</h2>
      <label class="toggle"><input type="checkbox" id="showDone"> Vis færdige</label>
    </div>
    <div class="grid" id="categories"></div>
  </div>
</main>

<dialog id="editDlg">
  <form id="editForm">
    <h2>Rediger opgave</h2>
    <label>Titel <input type="text" id="eTitle" required></label>
    <label>Deadline <input type="date" id="eDue"></label>
    <label>Noter <textarea id="eNotes" rows="3"></textarea></label>
    <label class="check"><input type="checkbox" id="eDone"> Markér som færdig</label>
    <p class="err" id="eErr" hidden></p>
    <div class="actions">
      <button type="button" class="ghost" id="eCancel">Annuller</button>
      <button type="submit" id="eSave">Gem</button>
    </div>
  </form>
</dialog>

<script src="https://accounts.google.com/gsi/client" async defer></script>
<script>
  // Dit Google OAuth klient-id fra Google Cloud Console:
  const CLIENT_ID = "737561708169-rsn7gf2iknvp8osmd0bjkfok591eg2db.apps.googleusercontent.com";

  const SCOPE = "https://www.googleapis.com/auth/tasks";
  const API = "https://tasks.googleapis.com/tasks/v1";
  const TOKEN_KEY = "gt_token_v2";
  const DAY = 86400000;

  const $ = (id) => document.getElementById(id);
  const fmtLong = new Intl.DateTimeFormat("da-DK", { weekday: "short", day: "numeric", month: "short", year: "numeric", timeZone: "UTC" });
  const fmtShort = new Intl.DateTimeFormat("da-DK", { day: "numeric", month: "short", timeZone: "UTC" });
  const fmtWd = new Intl.DateTimeFormat("da-DK", { weekday: "short", timeZone: "UTC" });
  const fmtMonth = new Intl.DateTimeFormat("da-DK", { month: "short", timeZone: "UTC" });

  let tokenClient = null;
  let loading = false;
  let editing = null;
  let tlScroll = null, tlCols = [], pending = null, pendingTimer = null;
  let state = { data: [], defaultId: null };

  function el(tag, cls, text) {
    const n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text != null) n.textContent = text;
    return n;
  }

  function setStatus(t) { $("status").textContent = t; }
  function showError(msg) { const e = $("error"); e.textContent = msg; e.hidden = false; }

  function friendly(e) {
    if (e.message === "FORBIDDEN") {
      return "Google afviste forespørgslen (403). Tjek, at Tasks API er slået til, og at appen har fået lov til at se og ændre dine opgaver. Fjern appens adgang på myaccount.google.com/permissions, og log ind igen.";
    }
    return e.message || "Noget gik galt.";
  }

  function getStoredToken() {
    try {
      const raw = sessionStorage.getItem(TOKEN_KEY);
      if (!raw) return null;
      const t = JSON.parse(raw);
      return t.expires > Date.now() + 30000 ? t.value : null;
    } catch { return null; }
  }
  function storeToken(value, expiresIn) {
    try { sessionStorage.setItem(TOKEN_KEY, JSON.stringify({ value, expires: Date.now() + expiresIn * 1000 })); } catch {}
  }

  function showLogin() {
    $("login").hidden = false;
    $("app").hidden = true;
    $("refresh").hidden = true;
    setStatus("");
  }

  async function api(path, token, opts) {
    opts = opts || {};
    const res = await fetch(API + path, {
      method: opts.method || "GET",
      headers: Object.assign({ Authorization: "Bearer " + token }, opts.body ? { "Content-Type": "application/json" } : {}),
      body: opts.body ? JSON.stringify(opts.body) : undefined
    });
    if (res.status === 401) { sessionStorage.removeItem(TOKEN_KEY); throw new Error("AUTH"); }
    if (res.status === 403) throw new Error("FORBIDDEN");
    if (!res.ok) throw new Error("Google svarede med fejl " + res.status);
    return res.json();
  }

  async function fetchAll(path, token) {
    let items = [], pageToken = "";
    do {
      const sep = path.includes("?") ? "&" : "?";
      const data = await api(path + (pageToken ? sep + "pageToken=" + encodeURIComponent(pageToken) : ""), token);
      items = items.concat(data.items || []);
      pageToken = data.nextPageToken || "";
    } while (pageToken);
    return items;
  }

  async function load(token) {
    if (loading) return;
    loading = true;
    $("error").hidden = true;
    $("login").hidden = true;
    setStatus("Henter …");
    try {
      const [lists, def] = await Promise.all([
        fetchAll("/users/@me/lists?maxResults=100", token),
        api("/users/@me/lists/@default", token)
      ]);
      state.defaultId = def.id;
      lists.sort((a, b) => (a.id === def.id ? -1 : b.id === def.id ? 1 : 0));
      state.data = await Promise.all(lists.map(async (l) => ({
        list: l,
        tasks: await fetchAll("/lists/" + encodeURIComponent(l.id) + "/tasks?maxResults=100&showCompleted=true&showHidden=false", token)
      })));
      $("app").hidden = false;
      render();
      $("refresh").hidden = false;
      setStatus("Opdateret " + new Date().toLocaleTimeString("da-DK", { hour: "2-digit", minute: "2-digit" }));
    } catch (e) {
      if (e.message === "AUTH") showLogin();
      else { showError(friendly(e)); setStatus(""); $("refresh").hidden = false; }
    } finally {
      loading = false;
    }
  }

  function todayUTC() {
    const n = new Date();
    return Date.UTC(n.getFullYear(), n.getMonth(), n.getDate());
  }
  function dueUTC(t) {
    const d = new Date(t.due);
    return Date.UTC(d.getUTCFullYear(), d.getUTCMonth(), d.getUTCDate());
  }

  function render() {
    renderTimeline();
    renderSelect();
    renderCategories();
  }

  function renderTimeline() {
    const root = $("timeline");
    root.textContent = "";
    tlScroll = null;
    tlCols = [];
    const t0 = todayUTC();
    const items = [];
    state.data.forEach(({ list, tasks }, li) => {
      tasks.forEach((t) => {
        if (t.status === "completed" || !t.due) return;
        const d = dueUTC(t);
        items.push({ t, list, li, day: Math.max(0, Math.round((d - t0) / DAY)), overdue: d < t0 });
      });
    });

    $("tlnav").hidden = !items.length;

    if (!items.length) {
      $("tlcaption").textContent = "";
      root.appendChild(el("div", "caption", "Ingen åbne opgaver har en deadline endnu."));
      return;
    }

    const last = Math.max(13, ...items.map((i) => i.day));
    const days = last + 1;
    $("tlcaption").textContent = "I dag til " + fmtLong.format(new Date(t0 + last * DAY));

    const scroll = el("div", "tl-scroll");
    const track = el("div", "tl-track");
    const widths = [];

    for (let i = 0; i < days; i++) {
      const date = new Date(t0 + i * DAY);
      const dow = date.getUTCDay();
      const here = items.filter((x) => x.day === i);
      const has = here.length > 0;
      widths.push(has ? 112 : i === 0 ? 64 : 40);
      const col = el("div", "day" + (i === 0 ? " today" : "") + (dow === 0 || dow === 6 ? " weekend" : "") + (has ? " has" : " empty"));

      const stack = el("div", "stack");
      here.forEach((x) => {
        const c = el("button", "chip" + (x.overdue ? " overdue" : ""));
        c.type = "button";
        c.appendChild(el("span", "ct", x.t.title || "(uden titel)"));
        c.style.setProperty("--lc", "var(--c" + (x.li % 6) + ")");
        c.style.setProperty("--lf", "var(--f" + (x.li % 6) + ")");
        c.title = (x.overdue ? "Forfalden: " : "") + (x.t.title || "") + " – " + x.list.title + " – " + fmtLong.format(new Date(x.t.due));
        c.addEventListener("click", () => openEdit(x.list.id, x.t));
        stack.appendChild(c);
      });
      col.appendChild(stack);
      col.appendChild(el("div", "axis"));

      const lab = el("div", "dlabel");
      if (has || i === 0) {
        lab.appendChild(el("span", "wd", i === 0 ? "I dag" : fmtWd.format(date)));
        lab.appendChild(document.createTextNode(fmtShort.format(date)));
      } else {
        lab.appendChild(el("span", "wd", date.getUTCDate() === 1 ? fmtMonth.format(date) : "\u00a0"));
        lab.appendChild(document.createTextNode(String(date.getUTCDate())));
      }
      col.appendChild(lab);
      track.appendChild(col);
      if (has) tlCols.push(col);
    }
    track.style.gridTemplateColumns = widths.map((w) => w + "px").join(" ");
    scroll.appendChild(track);
    root.appendChild(scroll);
    tlScroll = scroll;
  }

  function jump(dir) {
    if (!tlScroll || !tlCols.length) return;
    const base = pending !== null ? pending : tlScroll.scrollLeft;
    let target = null;
    if (dir > 0) {
      target = tlCols.find((c) => c.offsetLeft > base + 6);
    } else {
      for (let k = tlCols.length - 1; k >= 0; k--) {
        if (tlCols[k].offsetLeft < base - 6) { target = tlCols[k]; break; }
      }
    }
    if (!target) return;
    pending = target.offsetLeft;
    clearTimeout(pendingTimer);
    pendingTimer = setTimeout(() => { pending = null; }, 600);
    tlScroll.scrollTo({ left: Math.max(0, target.offsetLeft), behavior: "smooth" });
    target.classList.add("focus");
    setTimeout(() => target.classList.remove("focus"), 1300);
  }

  function renderSelect() {
    const sel = $("newList");
    const prev = sel.value;
    sel.textContent = "";
    state.data.forEach(({ list }) => {
      const o = el("option", null, list.title);
      o.value = list.id;
      sel.appendChild(o);
    });
    if (prev && state.data.some((d) => d.list.id === prev)) sel.value = prev;
    else if (state.defaultId) sel.value = state.defaultId;
  }

  function renderCategories() {
    const root = $("categories");
    root.textContent = "";
    const showDone = $("showDone").checked;
    const t0 = todayUTC();

    state.data.forEach(({ list, tasks }, li) => {
      const visible = tasks
        .filter((t) => showDone || t.status !== "completed")
        .sort((a, b) => (a.position || "").localeCompare(b.position || ""));
      if (!visible.length) return;

      const ids = new Set(visible.map((t) => t.id));
      const top = visible.filter((t) => !t.parent || !ids.has(t.parent));
      const kids = (id) => visible.filter((t) => t.parent === id);

      const box = el("section", "box");
      box.style.setProperty("--lc", "var(--c" + (li % 6) + ")");
      box.appendChild(el("h3", null, list.title));
      const ul = el("ul");

      const add = (t, sub) => {
        const row = el("li", (sub ? "sub " : "") + (t.status === "completed" ? "done" : ""));
        const tk = el("button", "tick");
        tk.type = "button";
        tk.title = t.status === "completed" ? "Markér som ikke færdig" : "Markér som færdig";
        tk.setAttribute("aria-label", tk.title + ": " + (t.title || ""));
        tk.setAttribute("aria-pressed", t.status === "completed" ? "true" : "false");
        tk.addEventListener("click", () => toggleDone(list.id, t));
        row.appendChild(tk);
        const body = el("div", "body");
        body.appendChild(el("div", "title", t.title || "(uden titel)"));
        if (t.due) {
          const late = t.status !== "completed" && dueUTC(t) < t0;
          body.appendChild(el("div", "meta" + (late ? " late" : ""), (late ? "Forfalden · " : "") + fmtLong.format(new Date(t.due))));
        }
        if (t.notes) body.appendChild(el("div", "meta", t.notes));
        row.appendChild(body);

        const eb = el("button", "edit", "✎");
        eb.type = "button";
        eb.title = "Rediger opgave";
        eb.setAttribute("aria-label", "Rediger opgave: " + (t.title || ""));
        eb.addEventListener("click", () => openEdit(list.id, t));
        row.appendChild(eb);
        ul.appendChild(row);
      };
      top.forEach((t) => { add(t, false); kids(t.id).forEach((c) => add(c, true)); });

      box.appendChild(ul);
      root.appendChild(box);
    });

    if (!root.children.length) {
      root.appendChild(el("div", "card caption", "Ingen opgaver at vise."));
    }
  }

  async function toggleDone(listId, t) {
    const token = getStoredToken();
    if (!token) { showLogin(); return; }
    const prev = t.status;
    const done = prev !== "completed";
    const body = { status: done ? "completed" : "needsAction" };
    if (!done) body.completed = null;
    t.status = body.status;
    render();
    try {
      await api("/lists/" + encodeURIComponent(listId) + "/tasks/" + encodeURIComponent(t.id), token, { method: "PATCH", body });
      await load(token);
    } catch (err) {
      t.status = prev;
      render();
      if (err.message === "AUTH") showLogin();
      else showError(friendly(err));
    }
  }

  function openEdit(listId, task) {
    editing = { listId, id: task.id };
    $("eTitle").value = task.title || "";
    $("eDue").value = task.due ? task.due.slice(0, 10) : "";
    $("eNotes").value = task.notes || "";
    $("eDone").checked = task.status === "completed";
    $("eErr").hidden = true;
    $("editDlg").showModal();
    $("eTitle").focus();
  }

  async function saveEdit(e) {
    e.preventDefault();
    if (!editing) return;
    const token = getStoredToken();
    if (!token) { $("editDlg").close(); showLogin(); return; }
    const title = $("eTitle").value.trim();
    if (!title) return;
    const done = $("eDone").checked;
    const body = {
      title,
      notes: $("eNotes").value.trim() || null,
      due: $("eDue").value ? $("eDue").value + "T00:00:00.000Z" : null,
      status: done ? "completed" : "needsAction"
    };
    if (!done) body.completed = null;
    const btn = $("eSave");
    btn.disabled = true;
    $("eErr").hidden = true;
    try {
      await api("/lists/" + encodeURIComponent(editing.listId) + "/tasks/" + encodeURIComponent(editing.id), token, { method: "PATCH", body });
      $("editDlg").close();
      editing = null;
      await load(token);
    } catch (err) {
      if (err.message === "AUTH") { $("editDlg").close(); showLogin(); }
      else { $("eErr").textContent = friendly(err); $("eErr").hidden = false; }
    } finally {
      btn.disabled = false;
    }
  }

  async function createTask(e) {
    e.preventDefault();
    const title = $("newTitle").value.trim();
    if (!title) return;
    const token = getStoredToken();
    if (!token) { showLogin(); return; }
    const body = { title };
    const due = $("newDue").value;
    if (due) body.due = due + "T00:00:00.000Z";
    const listId = $("newList").value || state.defaultId;
    const btn = $("newBtn");
    btn.disabled = true;
    $("error").hidden = true;
    try {
      await api("/lists/" + encodeURIComponent(listId) + "/tasks", token, { method: "POST", body });
      $("newTitle").value = "";
      $("newDue").value = "";
      $("newList").value = state.defaultId;
      $("addBox").open = false;
      await load(token);
    } catch (err) {
      if (err.message === "AUTH") showLogin();
      else showError(friendly(err));
    } finally {
      btn.disabled = false;
    }
  }

  function requestToken(prompt) {
    if (tokenClient) tokenClient.requestAccessToken({ prompt });
  }

  function refresh() {
    const t = getStoredToken();
    if (t) load(t);
    else requestToken("");
  }

  function init() {
    if (CLIENT_ID.startsWith("INDSÆT")) { $("setup").hidden = false; return; }
    if (!window.google || !google.accounts) { setTimeout(init, 100); return; }

    tokenClient = google.accounts.oauth2.initTokenClient({
      client_id: CLIENT_ID,
      scope: SCOPE,
      callback: (resp) => {
        if (resp.error) { showLogin(); return; }
        storeToken(resp.access_token, Number(resp.expires_in) || 3600);
        load(resp.access_token);
      },
      error_callback: () => showLogin()
    });

    $("signin").addEventListener("click", () => requestToken("select_account"));
    $("refresh").addEventListener("click", refresh);
    $("newForm").addEventListener("submit", createTask);
    $("showDone").addEventListener("change", renderCategories);
    $("tlPrev").addEventListener("click", () => jump(-1));
    $("tlNext").addEventListener("click", () => jump(1));
    $("editForm").addEventListener("submit", saveEdit);
    $("eCancel").addEventListener("click", () => $("editDlg").close());
    document.addEventListener("visibilitychange", () => { if (!document.hidden) refresh(); });

    refresh();
  }

  window.addEventListener("load", init);
</script>
</body>
</html>
